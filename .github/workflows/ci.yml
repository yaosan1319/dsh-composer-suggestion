name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse every runtime module
        run: |
          for file in index.js host.js client.js; do
            node --check "$file"
          done
      - name: Verify the package manifest and file list
        run: npm pack --dry-run
